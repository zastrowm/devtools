name: 'Strands Parse Input'
description: 'Parse strands command input and prepare execution parameters'
inputs:
  issue_id:
    description: 'Issue or PR number'
    required: false
  command:
    description: 'Strands command'
    required: false
  session_id:
    description: 'Session ID'
    required: false
  system_prompt_suffix:
    description: 'Additional instructions to append to the system prompt'
    required: false
    default: ''
  head_sha:
    description: 'PR head SHA resolved up front (from the authorization job for a /strands comment, or the pull_request event SHA for auto-review). Required for pull requests; the parser stops rather than resolve live HEAD.'
    required: false
    default: ''
  head_repo:
    description: 'PR head repository (owner/name)'
    required: false
    default: ''
  head_ref:
    description: 'PR head branch name'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    # Copy the scripts and SOPs from the same devtools commit as this action, so a
    # consumer that pins the action also pins the scripts. GITHUB_ACTION_PATH is this
    # action's directory in the devtools copy that the runner downloaded for `uses:`.
    # The copy goes to the runner temp directory so repository content cant overwrite
    # the scripts executed here
    - name: Copy devtools to safe directory
      shell: bash
      run: |
        DEVTOOLS_COMMAND_DIR="$(cd "$GITHUB_ACTION_PATH/../.." && pwd)"
        mkdir -p ${{ runner.temp }}/strands-input-parser/strands-command
        cp -r "$DEVTOOLS_COMMAND_DIR/scripts" "$DEVTOOLS_COMMAND_DIR/agent-sops" ${{ runner.temp }}/strands-input-parser/strands-command/

    - name: Add strands-running label
      uses: actions/github-script@v8
      with:
        github-token: ${{ github.token }}
        script: |
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: ${{ inputs.issue_id || github.event.issue.number }},
            labels: ['strands-running']
          });

    - name: Process input
      uses: actions/github-script@v8
      env:
        # Passed via env, not script interpolation: the suffix is free-form text
        # (markdown with backticks, ${...}, etc.) that would otherwise break the
        # surrounding JS template literal. head_ref is an arbitrary branch name,
        # so it gets the same treatment.
        SYSTEM_PROMPT_SUFFIX: ${{ inputs.system_prompt_suffix }}
        HEAD_SHA: ${{ inputs.head_sha }}
        HEAD_REPO: ${{ inputs.head_repo }}
        HEAD_REF: ${{ inputs.head_ref }}
        STRANDS_COMMAND_DIR: ${{ runner.temp }}/strands-input-parser/strands-command
      with:
        script: |
          const processInput = require(`${process.env.STRANDS_COMMAND_DIR}/scripts/javascript/process-input.cjs`);
          await processInput(context, github, core, {
            issue_id: '${{ inputs.issue_id }}',
            command: '${{ inputs.command }}',
            session_id: '${{ inputs.session_id }}',
            head_sha: process.env.HEAD_SHA,
            head_repo: process.env.HEAD_REPO,
            head_ref: process.env.HEAD_REF,
            system_prompt_suffix: process.env.SYSTEM_PROMPT_SUFFIX
          });

    - name: Upload parsed input artifact
      uses: actions/upload-artifact@v4
      with:
        name: strands-parsed-input
        path: strands-parsed-input.json
        retention-days: 1
